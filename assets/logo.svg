<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer double ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#1e3a8a" stroke-width="4" stroke-dasharray="4 2"/>
  <circle cx="100" cy="100" r="88" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2"/>
  
  <!-- Text along circle -->
  <path id="circlePath" d="M 25,100 A 75,75 0 1,1 175,100 A 75,75 0 1,1 25,100" fill="none" stroke="none"/>
  
  <!-- Central Shield / Atom / Gear motif -->
  <g transform="translate(100,100)">
    <!-- Gear / Sun rays -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-opacity="0.3"/>
    
    <!-- Atom orbits representing Science & Technology -->
    <ellipse cx="0" cy="0" rx="42" ry="16" fill="none" stroke="url(#grad1)" stroke-width="2.5" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="42" ry="16" fill="none" stroke="url(#grad1)" stroke-width="2.5" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="42" ry="16" fill="none" stroke="url(#grad1)" stroke-width="2.5" transform="rotate(120)"/>
    
    <!-- Center Nucleus & Torch of Knowledge -->
    <circle cx="0" cy="0" r="12" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    
    <!-- Electrons on orbits -->
    <circle cx="42" cy="0" r="4" fill="#3b82f6"/>
    <circle cx="-21" cy="36.37" r="4" fill="#3b82f6"/>
    <circle cx="-21" cy="-36.37" r="4" fill="#3b82f6"/>
  </g>
  
  <!-- Open Book of Learning at base -->
  <path d="M 65 142 Q 100 135 100 148 Q 100 135 135 142 L 135 155 Q 100 148 100 160 Q 100 148 65 155 Z" fill="#1e3a8a"/>
  
  <!-- Banner ribbon -->
  <path d="M 45 168 L 155 168 L 145 180 L 155 192 L 45 192 L 55 180 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1"/>
  <text x="100" y="184" font-family="'Times New Roman', serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">VIDYANAGAR • ESTD 1979</text>
  
  <!-- Header Text inside Seal -->
  <text x="100" y="38" font-family="'Times New Roman', serif" font-size="10.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle" letter-spacing="1.5">N.B.K.R.I.S.T.</text>
  <text x="100" y="52" font-family="'Times New Roman', serif" font-size="7.5" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">AUTONOMOUS</text>
</svg>
