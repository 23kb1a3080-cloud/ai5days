<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Exact NBKRIST Emblem Vector -->
  <!-- Outer gear / sun teeth ring -->
  <g fill="none" stroke="#000000" stroke-width="1.2">
    <!-- Outer dashed/toothed ring -->
    <circle cx="120" cy="100" r="70" stroke-dasharray="3, 2" stroke-width="1.8"/>
    <circle cx="120" cy="100" r="64" stroke-width="1.2"/>
    <circle cx="120" cy="100" r="54" stroke-width="0.8"/>
    
    <!-- Text along top: N.B.K.R. INSTITUTE OF SCIENCE & TECHNOLOGY -->
    <path id="textArcTop" d="M 64,100 A 56,56 0 1,1 176,100" fill="none"/>
    <text font-family="'Times New Roman', serif" font-size="6.8" font-weight="bold" fill="#000000" letter-spacing="0.8">
      <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
        N.B.K.R. INSTITUTE OF SCIENCE &amp; TECH.
      </textPath>
    </text>

    <!-- Text along bottom: VIDYANAGAR -->
    <path id="textArcBottom" d="M 72,100 A 48,48 0 0,0 168,100" fill="none"/>
    <text font-family="'Times New Roman', serif" font-size="6.5" font-weight="bold" fill="#000000" letter-spacing="1">
      <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
        VIDYANAGAR
      </textPath>
    </text>
    
    <!-- Central Atom Orbits -->
    <g transform="translate(120, 96)">
      <!-- Central nucleus -->
      <circle cx="0" cy="0" r="10" fill="#000000"/>
      <circle cx="0" cy="0" r="6" fill="#ffffff"/>
      <circle cx="0" cy="0" r="2.5" fill="#000000"/>
      
      <!-- Orbits -->
      <ellipse cx="0" cy="0" rx="36" ry="12" transform="rotate(0)" stroke="#000000" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="36" ry="12" transform="rotate(60)" stroke="#000000" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="36" ry="12" transform="rotate(120)" stroke="#000000" stroke-width="1.5"/>
      
      <!-- Electrons -->
      <circle cx="36" cy="0" r="3" fill="#000000"/>
      <circle cx="-18" cy="31.17" r="3" fill="#000000"/>
      <circle cx="-18" cy="-31.17" r="3" fill="#000000"/>
    </g>
  </g>
  
  <!-- Banner Ribbon at the bottom -->
  <g transform="translate(120, 182)">
    <path d="M -75,0 L 75,0 L 65,8 L 75,16 L -75,16 L -65,8 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="0" y="11" font-family="'Times New Roman', serif" font-size="7.5" font-weight="bold" font-style="italic" fill="#000000" text-anchor="middle" letter-spacing="0.5">
      VIDYANAGAR
    </text>
  </g>
</svg>
